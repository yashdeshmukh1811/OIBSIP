<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Nexus Auth</title>
    <meta name="description" content="Log in to your account.">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Welcome Back</h2>
        <p class="subtitle">Log in to access your dashboard.</p>
        
        <div id="alertMsg" class="alert-msg"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="identifier">Username or Email</label>
                <input type="text" id="identifier" name="identifier" placeholder="Enter your username or email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
            </div>

            <button type="submit">Login</button>
        </form>

        <div class="message">
            Don't have an account? <a href="/register.html">Create one</a>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
