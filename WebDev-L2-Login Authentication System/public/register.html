<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Nexus Auth</title>
    <meta name="description" content="Register an account.">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>
        <p class="subtitle">Join us to experience seamless authentication.</p>
        
        <div id="alertMsg" class="alert-msg"></div>

        <form id="registerForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter your username" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="At least 8 chars & 1 number" required>
            </div>

            <button type="submit">Register</button>
        </form>

        <div class="message">
            Already have an account? <a href="/login.html">Login here</a>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
